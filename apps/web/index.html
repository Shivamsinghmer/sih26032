<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0075de" />
    <meta name="description" content="Capacity-aware slot booking and queue management for agricultural procurement centres." />
    <title>Mandi Queue</title>
  </head>
  <body>
    <!--
      The shell paints before React boots. SSR was given up in the two-service
      split, so without this a farmer on a weak connection stares at a white
      page for the length of the bundle download.
    -->
    <div id="root">
      <div class="boot">
        <div class="boot-mark"></div>
        <p>Loading Mandi Queue…</p>
      </div>
    </div>
    <style>
      .boot { min-height: 100dvh; display: grid; place-content: center; justify-items: center;
              gap: 16px; background: #f6f5f4; color: rgba(0,0,0,.6);
              font: 400 16px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; }
      .boot-mark { width: 36px; height: 36px; border-radius: 9999px;
                   border: 3px solid rgba(0,0,0,.1); border-top-color: #0075de;
                   animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-mark { animation: none; } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
